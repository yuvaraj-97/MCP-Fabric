# GitHub Actions Workflow to build and deploy Sphinx Docs to Cloudflare Pages / GitHub Pages

name: Deploy Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Documentation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx furo myst-parser sphinx-copybutton sphinx-autodoc-typehints sphinx-multiversion

      - name: Build Sphinx HTML Docs
        run: |
          make -C docs html
          # Include CNAME in build output for custom domain setup
          cp docs/CNAME docs/_build/html/CNAME || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build-output
          path: docs/_build/html/
