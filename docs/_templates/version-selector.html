<div class="version-selector-container" style="padding: 10px 15px; background: rgba(238, 76, 44, 0.08); border-radius: 6px; margin-bottom: 15px;">
  <label for="version-select" style="font-weight: 600; font-size: 0.85rem; display: block; margin-bottom: 4px; color: var(--color-foreground-primary);">
    📦 Version:
  </label>
  <select id="version-select" onchange="window.location.href=this.value;" style="width: 100%; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--color-brand-primary); background: var(--color-background-primary); color: var(--color-foreground-primary); font-size: 0.85rem; cursor: pointer;">
    {%- if smv_current_version %}
      {%- for version in smv_versions %}
        <option value="{{ version.url }}" {% if version.name == smv_current_version.name %}selected{% endif %}>
          {{ version.name }} {% if version.is_released %}(release){% endif %}
        </option>
      {%- endfor %}
    {%- else %}
      <option value="#" selected>v0.3.1 (latest)</option>
      <option value="#">v0.3.0</option>
      <option value="#">main (dev)</option>
    {%- endif %}
  </select>
</div>
