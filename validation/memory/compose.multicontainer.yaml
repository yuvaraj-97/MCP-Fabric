services:
  mcp-server-a:
    image: node:20
    working_dir: /workspace
    volumes:
      - ../../:/workspace
    environment:
      HOST: "0.0.0.0"
      PORT: "4111"
      STORE_FILE: /workspace/validation-artifacts/memory-multicontainer/memory-store.json
      SERVER_INSTANCE_ID: mem-a
    command: ["node", "validation/memory/remote-memory-server.js"]

  mcp-server-b:
    image: node:20
    working_dir: /workspace
    volumes:
      - ../../:/workspace
    environment:
      HOST: "0.0.0.0"
      PORT: "4112"
      STORE_FILE: /workspace/validation-artifacts/memory-multicontainer/memory-store.json
      SERVER_INSTANCE_ID: mem-b
    command: ["node", "validation/memory/remote-memory-server.js"]

  gateway:
    image: node:20
    working_dir: /workspace
    volumes:
      - ../../:/workspace
    depends_on:
      - mcp-server-a
      - mcp-server-b
    environment:
      HOST: "0.0.0.0"
      PORT: "4210"
      LOAD_THRESHOLD: "0.8"
      MCP_GATEWAY_ALLOW_PUBLIC_BIND: "1"
      MCP_GATEWAY_ENFORCE_STARTUP_SECURITY_AUDIT: "0"
      MCP_GATEWAY_ADAPTIVE_PLACEMENT_ENABLED: ${MCP_GATEWAY_ADAPTIVE_PLACEMENT_ENABLED:-false}
      MCP_GATEWAY_ADAPTIVE_PLACEMENT_CLIENT_ALLOWLIST: ${MCP_GATEWAY_ADAPTIVE_PLACEMENT_CLIENT_ALLOWLIST:-}
      SERVER_INSTANCES_JSON: >-
        [{"serverInstanceId":"mem-a","load":0.14,"healthy":true,"acceptingNewSessions":true},
        {"serverInstanceId":"mem-b","load":0.26,"healthy":true,"acceptingNewSessions":true}]
      REMOTE_BASE_URLS_JSON: >-
        {"mem-a":"http://mcp-server-a:4111","mem-b":"http://mcp-server-b:4112"}
    command: ["node", "validation/multicontainer/remote-gateway.js"]

  client:
    image: node:20
    working_dir: /workspace
    volumes:
      - ../../:/workspace
    depends_on:
      - gateway
    environment:
      MCP_MEMORY_MULTICONTAINER_GATEWAY_URL: http://gateway:4210
      MCP_MEMORY_MULTICONTAINER_SERVER_URLS: mem-a=http://mcp-server-a:4111,mem-b=http://mcp-server-b:4112
      MCP_MEMORY_MULTICONTAINER_KEEP_ARTIFACTS: "1"
      MCP_MEMORY_MULTICONTAINER_ADAPTIVE_PLACEMENT: ${MCP_MEMORY_MULTICONTAINER_ADAPTIVE_PLACEMENT:-0}
    command: ["node", "validation/memory/run-multicontainer-proof.js"]
