services:
  mcp-server-a:
    image: node:20
    working_dir: /workspace
    volumes:
      - ../../:/workspace
    environment:
      PORT: "4101"
      ROOT_DIR: /workspace/validation-artifacts/filesystem-multicontainer
      SERVER_INSTANCE_ID: fs-a
    command: ["node", "validation/multicontainer/remote-filesystem-server.js"]

  mcp-server-b:
    image: node:20
    working_dir: /workspace
    volumes:
      - ../../:/workspace
    environment:
      PORT: "4102"
      ROOT_DIR: /workspace/validation-artifacts/filesystem-multicontainer
      SERVER_INSTANCE_ID: fs-b
    command: ["node", "validation/multicontainer/remote-filesystem-server.js"]

  gateway:
    image: node:20
    working_dir: /workspace
    volumes:
      - ../../:/workspace
    depends_on:
      - mcp-server-a
      - mcp-server-b
    environment:
      HOST: "0.0.0.0"
      PORT: "4200"
      LOAD_THRESHOLD: "0.8"
      MCP_GATEWAY_ALLOW_PUBLIC_BIND: "1"
      MCP_GATEWAY_ENFORCE_STARTUP_SECURITY_AUDIT: "0"
      SERVER_INSTANCES_JSON: >-
        [{"serverInstanceId":"fs-a","load":0.12,"healthy":true,"acceptingNewSessions":true},
        {"serverInstanceId":"fs-b","load":0.28,"healthy":true,"acceptingNewSessions":true}]
      REMOTE_BASE_URLS_JSON: >-
        {"fs-a":"http://mcp-server-a:4101","fs-b":"http://mcp-server-b:4102"}
    command: ["node", "validation/multicontainer/remote-gateway.js"]

  client:
    image: node:20
    working_dir: /workspace
    volumes:
      - ../../:/workspace
    depends_on:
      - gateway
    environment:
      MCP_MULTICONTAINER_GATEWAY_URL: http://gateway:4200
      MCP_MULTICONTAINER_SERVER_URLS: fs-a=http://mcp-server-a:4101,fs-b=http://mcp-server-b:4102
      MCP_MULTICONTAINER_KEEP_ARTIFACTS: "1"
    command: ["node", "validation/multicontainer/run-filesystem-proof.js"]
